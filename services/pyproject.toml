[project]
name = "gradportal-services"
version = "0.1.0"
description = "GradPortal AI services: documents, RAG chat, admissions evaluation, voice."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "tiktoken>=0.8.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "doc_service*", "rag_service*", "eval_service*", "voice_service*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; reformatting them only creates migration diffs.
extend-exclude = ["migrations/*/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body",
    "fastapi.Path", "fastapi.Header", "fastapi.Form", "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"*/prompts.py" = ["E501"]
"*/rubrics.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
